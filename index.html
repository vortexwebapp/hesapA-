<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>XhesapAi // Market Pro</title>
    <style>
        :root { --bg: #000; --accent: #007bff; --surface: #0a0a0a; --border: #333; }
        * { box-sizing: border-box; }
        body { background: var(--bg); color: #fff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; position: fixed; width: 100%; height: 100%; overflow: hidden; display: flex; flex-direction: column; }
        
        header { padding: 10px 15px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: var(--surface); height: 45px; flex-shrink: 0; }
        .logo { font-size: 12px; font-weight: 800; letter-spacing: 2px; color: var(--accent); }
        .model-select { background: #111; color: #fff; border: 1px solid var(--border); padding: 5px 8px; font-size: 11px; border-radius: 4px; cursor: pointer; }
        
        .action-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; padding: 10px 15px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
        @media (min-width: 600px) { .action-grid { grid-template-columns: repeat(4, 1fr); } }
        .action-btn { background: var(--accent); color: white; border: none; padding: 10px; font-size: 11px; font-weight: bold; cursor: pointer; border-radius: 4px; text-transform: uppercase; }
        .action-btn:disabled { background: #222; color: #555; cursor: not-allowed; }
        
        /* Görsel ekleme butonunu en üste, sohbetin hemen üstüne taşıdık */
        .control { padding: 10px 15px; background: var(--surface); border-bottom: 1px solid var(--border); flex-shrink: 0; }
        input[type="file"] { display: none; }
        .upload-btn { background: #1d4ed8; padding: 12px; text-align: center; display: block; font-weight: bold; cursor: pointer; border-radius: 4px; text-transform: uppercase; font-size: 12px; width: 100%; border: 1px solid #3b82f6; }
        .upload-btn:hover { background: #2563eb; }

        /* Sohbet alanı kalan boşluğu doldurur */
        .chat-container { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; -webkit-overflow-scrolling: touch; }
        .msg { padding: 12px; border-left: 4px solid var(--accent); background: var(--surface); border: 1px solid var(--border); border-radius: 4px; font-size: 13px; line-height: 1.5; word-break: break-word; }
        .msg img { max-width: 100%; max-height: 200px; border-radius: 4px; margin-bottom: 8px; display: block; object-fit: contain; border: 1px solid var(--border); }
    </style>
</head>
<body>

    <header>
        <div class="logo">XHESAPAI // MARKET PRO</div>
        <select id="modelSelect" class="model-select">
            <option value="openai/gpt-4o-mini">GPT-4o Mini (Önerilen)</option>
            <option value="google/gemini-flash-1.5">Gemini Flash 1.5</option>
            <option value="anthropic/claude-3-haiku">Claude 3 Haiku</option>
        </select>
    </header>

    <div class="action-grid">
        <button class="action-btn" id="b1" onclick="analiz('piyasa')" disabled>Piyasa Değeri</button>
        <button class="action-btn" id="b2" onclick="analiz('ogeler')" disabled>Detaylı Parçalar</button>
        <button class="action-btn" id="b3" onclick="analiz('satis')" disabled>Hemen Satış</button>
        <button class="action-btn" id="b4" onclick="analiz('ozet')" disabled>Hesap Özeti</button>
    </div>

    <!-- Görsel Ekleme Butonu Artık Burada, Yukarıda! -->
    <div class="control">
        <label class="upload-btn">📁 OYUN GÖRSELİ SEÇ
            <input type="file" id="fileInput" accept="image/*" onchange="gorselSecildi(event)">
        </label>
    </div>

    <div class="chat-container" id="chat">
        <div class="msg" id="welcomeMsg"><strong>XhesapAi:</strong> Görsel yükleme butonu yukarıya taşındı kanka! Artık direkt işlem yapabilirsin.</div>
    </div>

    <script>
        const API_KEY = "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";
        let imgBase64 = "";

        function gorselSecildi(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    let width = img.width;
                    let height = img.height;
                    
                    const MAX_WIDTH = 1024;
                    const MAX_HEIGHT = 1024;
                    if (width > height) {
                        if (width > MAX_WIDTH) {
                            height *= MAX_WIDTH / width;
                            width = MAX_WIDTH;
                        }
                    } else {
                        if (height > MAX_HEIGHT) {
                            width *= MAX_HEIGHT / height;
                            height = MAX_HEIGHT;
                        }
                    }

                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);
                    
                    imgBase64 = canvas.toDataURL('image/jpeg', 0.85);

                    const chat = document.getElementById('chat');
                    chat.innerHTML += `<div class="msg"><img src="${imgBase64}"><strong>Sistem:</strong> Görsel başarıyla yüklendi kanka! Şimdi yukarıdaki analiz tuşlarından birine basabilirsin.</div>`;
                    
                    ['b1', 'b2', 'b3', 'b4'].forEach(id => document.getElementById(id).disabled = false);
                    chat.scrollTop = chat.scrollHeight;
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        async function analiz(tip) {
            const chat = document.getElementById('chat');
            const selectedModel = document.getElementById('modelSelect').value;
            
            const komutlar = {
                'piyasa': "Görseldeki hesabı e-ticaret/oyun hesap pazar sitelerindeki benzer ilanlarla kıyasla. Kupa ve karakter seviyesini baz alarak mantıklı piyasa değerini TL cinsinden net olarak ver.",
                'ogeler': "Hesabın içeriğindeki karakter oranını ve detayları incele, değerini artıran veya eksilten unsurları listele.",
                'satis': "Bu hesabın bir oyuncu pazarında ilana konulduğunda hızlıca alıcı bulabileceği en mantıklı 'Hemen Satış Fiyatını' (TL) net rakamla yaz.",
                'ozet': "Hesabın tüm verilerini pazar standartlarına göre özetle uygun fiyatlar ver abartma resmi incele."
            };

            const loadingId = 'load_' + Date.now();
            chat.innerHTML += `<div class="msg" id="${loadingId}"><strong>Piyasa verileri taranıyor (${selectedModel})...</strong></div>`;
            chat.scrollTop = chat.scrollHeight;

            try {
                const res = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                    method: "POST",
                    headers: { 
                        "Authorization": `Bearer ${API_KEY}`, 
                        "Content-Type": "application/json",
                        "HTTP-Referer": "https://xhesapai.com",
                        "X-Title": "XhesapAi"
                    },
                    body: JSON.stringify({
                        "model": selectedModel,
                        "messages": [
                            { 
                                "role": "system", 
                                "content": "Sen profesyonel bir oyun pazar analistisin. Madde madde, net ve Türkçe pazar raporu sun." 
                            },
                            { 
                                "role": "user", 
                                "content": [
                                    { "type": "text", "text": komutlar[tip] },
                                    { "type": "image_url", "image_url": { "url": imgBase64 } }
                                ]
                            }
                        ]
                    })
                });

                const data = await res.json();
                document.getElementById(loadingId).remove();
                
                if (data.choices && data.choices[0].message && data.choices[0].message.content) {
                    chat.innerHTML += `<div class="msg"><strong>XhesapAi Pazar Raporu:</strong><br><br>${data.choices[0].message.content.replace(/\n/g, '<br>')}</div>`;
                } else {
                    chat.innerHTML += `<div class="msg"><strong>Hata:</strong> Yanıt alınamadı kanka.</div>`;
                }
            } catch (err) {
                document.getElementById(loadingId).remove();
                chat.innerHTML += `<div class="msg"><strong>Bağlantı Hatası: ${err.message}</strong></div>`;
            }
            chat.scrollTop = chat.scrollHeight;
        }
    </script>
</body>
</html>
