<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RoleLog Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #f3f4f6; padding: 15px; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 15px; }
        .hidden { display: none; }
        .btn-full { width: 100%; padding: 12px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; color: white; background: #2563eb; }
        .btn-full:disabled { background: #93c5fd; cursor: not-allowed; }
        .nav-btn { flex: 1; padding: 10px; border: none; background: #e5e7eb; font-weight: bold; font-size: 13px; border-radius: 8px; cursor: pointer; }
        .nav-btn.active { background: #2563eb; color: #fff; }
        .log-item { background: #f9fafb; padding: 10px; border-radius: 6px; margin-bottom: 8px; font-size: 13px; border-left: 4px solid #2563eb; }
    </style>
</head>
<body>

    <!-- 1. GİRİŞ EKRANI -->
    <div id="loginSection" class="container">
        <div class="card" style="text-align:center;">
            <h2 style="margin-bottom:20px;">RoleLog Pro'ya Giriş Yap</h2>
            <button id="googleLoginBtn" class="btn-full" style="background:#000;">Google ile Bağlan</button>
        </div>
    </div>

    <!-- 2. ANA PANEL (Başta gizli) -->
    <div id="mainSection" class="container hidden">
        <div class="card" style="display:flex; gap:10px; margin-bottom:15px;">
            <button class="nav-btn active" onclick="showTab('api', this)">API</button>
            <button class="nav-btn" onclick="showTab('logs', this)">Loglar</button>
            <button class="nav-btn" onclick="showTab('support', this)">Destek</button>
        </div>

        <div id="api" class="card tab-content">
            <h3>API Anahtarın</h3>
            <p id="apiKeyDisplay" style="margin:10px 0; font-family:monospace; color:#2563eb; font-weight:bold;">Yükleniyor...</p>
            <button id="genBtn" class="btn-full" onclick="generateApiKey()">Yeni Anahtar Üret</button>
        </div>

        <div id="logs" class="card tab-content hidden">
            <h3>Canlı Loglar</h3>
            <div id="logContainer" style="margin-top:10px; max-height:200px; overflow-y:auto;">
                <p style="color:#6b7280; font-size:13px;">Loglar yükleniyor...</p>
            </div>
        </div>

        <div id="support" class="card tab-content hidden">
            <h3>Destek</h3>
            <textarea id="supportText" style="width:100%; height:80px; margin:10px 0; padding:8px; border:1px solid #ccc; border-radius:6px;" placeholder="Sorununuzu yazın..."></textarea>
            <button id="supBtn" class="btn-full" style="background:#059669;" onclick="sendSupport()">Talebi Gönder</button>
        </div>
    </div>

    <!-- Firebase SDK'ları -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc, collection, addDoc, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCgLjDm0gdq35iwe2B937vJTTlDN9C32a4",
            authDomain: "rolelog-2cd36.firebaseapp.com",
            projectId: "rolelog-2cd36",
            storageBucket: "rolelog-2cd36.firebasestorage.app",
            messagingSenderId: "193310879356",
            appId: "1:193310879356:web:1afc9cacd43cedafe263f9"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;

        document.getElementById('googleLoginBtn').onclick = async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (err) {
                alert("Giriş hatası: " + err.message);
            }
        };

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('loginSection').classList.add('hidden');
                document.getElementById('mainSection').classList.remove('hidden');
                
                await checkAndLoadApiKey(user.uid);
                await loadUserLogs(user.uid);
            }
        });

        // Anahtarı Kontrol Et / Yoksa Otomatik Üret ve Asla Takılma
        async function checkAndLoadApiKey(uid) {
            const display = document.getElementById('apiKeyDisplay');
            try {
                const userRef = doc(db, "users", uid);
                const userSnap = await getDoc(userRef);
                
                if (userSnap.exists() && userSnap.data().apiKey) {
                    display.innerText = userSnap.data().apiKey;
                } else {
                    // Kayıt yoksa anında yeni bir tane oluşturup yapıştırıyoruz
                    await generateApiKey(true);
                }
            } catch (e) {
                display.innerText = "Bağlantı sorunu, butona basarak üretin.";
            }
        }

        window.generateApiKey = async (isAuto = false) => {
            if (!currentUser) return;
            const btn = document.getElementById('genBtn');
            btn.disabled = true;
            btn.innerText = "İşleniyor...";

            const newKey = "XHP-" + Math.random().toString(36).substring(2, 10).toUpperCase();
            
            try {
                // setDoc ile kullanıcı belgesini garanti altına alıyoruz
                await setDoc(doc(db, "users", currentUser.uid), { apiKey: newKey }, { merge: true });
                document.getElementById('apiKeyDisplay').innerText = newKey;
                
                if (!isAuto) {
                    await addDoc(collection(db, "logs"), {
                        uid: currentUser.uid,
                        text: "Yeni API anahtarı üretildi: " + newKey,
                        time: new Date().toLocaleTimeString()
                    });
                    await loadUserLogs(currentUser.uid);
                }
            } catch (err) {
                alert("Hata oluştu: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Yeni Anahtar Üret";
            }
        };

        async function loadUserLogs(uid) {
            const container = document.getElementById('logContainer');
            container.innerHTML = "";
            try {
                const q = query(collection(db, "logs"), where("uid", "==", uid));
                const querySnapshot = await getDocs(q);
                
                if (querySnapshot.empty) {
                    container.innerHTML = '<p style="color:#6b7280; font-size:13px;">Hiç log kaydı yok.</p>';
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    container.innerHTML += `<div class="log-item">[${data.time}] ${data.text}</div>`;
                });
            } catch (err) {
                container.innerHTML = '<p style="color:red; font-size:13px;">Loglar yüklenemedi.</p>';
            }
        }

        window.sendSupport = async () => {
            const text = document.getElementById('supportText').value;
            if(!text) return alert("Boş bırakma!");
            
            const btn = document.getElementById('supBtn');
            btn.disabled = true;
            btn.innerText = "Gönderiliyor...";

            try {
                await addDoc(collection(db, "logs"), {
                    uid: currentUser.uid,
                    text: "Destek talebi: " + text,
                    time: new Date().toLocaleTimeString()
                });
                document.getElementById('supportText').value = "";
                alert("Destek talebi gönderildi!");
                await loadUserLogs(currentUser.uid);
            } catch (err) {
                alert("Hata: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerText = "Talebi Gönder";
            }
        };

        window.showTab = (id, btn) => {
            document.querySelectorAll('.tab-content').forEach(c => c.classList.add('hidden'));
            document.getElementById(id).classList.remove('hidden');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }
    </script>
</body>
</html>
